<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabungan Keluarga</title>
<style>
  :root {
    --bg:#F4F6FB;--surface:#fff;--border:#E2E8F4;
    --accent:#3B6FE0;--green:#18A066;--green-light:#E8F7F1;
    --red:#D94040;--red-light:#FDEAEA;
    --amber:#B45309;--amber-light:#FEF3C7;
    --purple:#6D28D9;--teal:#0D7377;
    --text:#1A1F2E;--muted:#7B859A;
    --shadow:0 1px 8px rgba(30,50,100,.08);
    color-scheme:light;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#0F1623;--surface:#1A2235;--border:#2A3650;
    --accent:#5B8FFF;--green:#2CC885;--green-light:#0F2920;
    --red:#FF6B6B;--red-light:#2A1515;
    --amber:#FCD34D;--amber-light:#2A1F05;
    --purple:#A78BFA;--teal:#2DD4BF;
    --text:#E8EDF8;--muted:#7B859A;
    --shadow:0 1px 8px rgba(0,0,0,.3);
  }}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 18px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between}
  .hl h1{font-size:16px;font-weight:700;letter-spacing:-.3px}
  .hl p{font-size:11px;color:var(--muted);margin-top:1px}
  .hr{display:flex;gap:8px;align-items:center}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:background .3s}
  .dot.ok{background:var(--green)}.dot.err{background:var(--red)}.dot.busy{background:var(--amber);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .bsm{display:flex;align-items:center;gap:5px;border:none;border-radius:9px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s;white-space:nowrap}
  .bsm:active{opacity:.75}.bp{background:var(--accent);color:#fff}.bg{background:var(--border);color:var(--text)}
  .grand{background:var(--accent);color:#fff;padding:16px 20px 18px;text-align:center}
  .grand .gl{font-size:10px;opacity:.75;letter-spacing:.7px;text-transform:uppercase}
  .grand .ga{font-size:28px;font-weight:700;letter-spacing:-1px;margin-top:2px}
  .grand .gd{font-size:10px;opacity:.6;margin-top:3px}
  .container{padding:14px 14px 32px;max-width:540px;margin:0 auto}
  .stitle{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:14px 4px 8px}
  .cw{margin-bottom:10px}
  .cs{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;transition:background .1s;user-select:none}
  .cs:active{background:var(--bg)}
  .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .si{flex:1;min-width:0}
  .sn{font-size:15px;font-weight:700}
  .ss{font-size:11px;color:var(--muted);margin-top:1px}
  .sb{font-size:17px;font-weight:700;color:var(--accent);text-align:right;flex-shrink:0}
  .sb.pu{color:var(--purple)}.sb.te{color:var(--teal)}
  .sb span{display:block;font-size:10px;color:var(--muted);font-weight:400}
  .cv{font-size:11px;color:var(--muted);transition:transform .2s;flex-shrink:0}
  .cv.open{transform:rotate(180deg)}
  .cd{display:none;background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 14px 14px;overflow:hidden;margin-top:-6px}
  .cd.open{display:block}
  .nb{display:flex;align-items:center;gap:7px;margin:10px 14px 0;background:var(--amber-light);border:1px solid var(--amber);border-radius:8px;padding:7px 11px;font-size:11px;color:var(--amber)}
  .history{padding:6px 0}
  .tr{display:flex;align-items:center;gap:9px;padding:7px 16px;transition:background .1s}
  .tr:hover{background:var(--bg)}
  .ti{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
  .ti.in{background:var(--green-light);color:var(--green)}.ti.out{background:var(--red-light);color:var(--red)}
  .td{flex:1;font-size:12px;min-width:0}
  .tn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tm{color:var(--muted);font-size:10px;display:flex;gap:5px;align-items:center;margin-top:1px}
  .tdb{background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:0 4px;font-size:10px;color:var(--muted)}
  .ta{font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0}
  .ta.in{color:var(--green)}.ta.out{color:var(--red)}
  .tdel{background:none;border:none;cursor:pointer;color:var(--muted);font-size:15px;padding:2px 3px;opacity:0;transition:opacity .2s}
  .tr:hover .tdel{opacity:1}
  .etx{padding:10px 16px;color:var(--muted);font-size:12px;text-align:center}
  .atx{padding:10px 16px 14px;border-top:1px solid var(--border)}
  .att{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px}
  .ir{display:grid;grid-template-columns:1fr 96px;gap:6px;margin-bottom:6px}
  input[type=text],input[type=number],input[type=date]{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);font-size:13px;outline:none;transition:border-color .2s;-webkit-appearance:none;font-family:inherit}
  input:focus{border-color:var(--accent)}
  .br{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  button.btn{padding:8px 10px;border:none;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s}
  button.btn:active{opacity:.75}
  .bi{background:var(--green-light);color:var(--green)}.bo{background:var(--red-light);color:var(--red)}
  .scr{display:flex;align-items:center;gap:7px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--border)}
  .scl{font-size:10px;color:var(--muted);flex:1}
  .scr input[type=date]{padding:6px 9px;font-size:11px;max-width:140px}
  .bsc{padding:5px 11px;border:none;border-radius:7px;background:var(--amber-light);color:var(--amber);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
  .bsc:active{opacity:.7}
  .lwrap{display:flex;align-items:center;justify-content:center;padding:60px 20px;color:var(--muted);font-size:14px}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A1F2E;color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s;z-index:100;white-space:nowrap}
  #toast.show{opacity:1}
  .fn{text-align:center;color:var(--muted);font-size:10px;padding:12px 20px 36px}
</style>
</head>
<body>
<header>
  <div class="hl">
    <h1>🏦 Tabungan Keluarga</h1>
    <p id="slbl">Menghubungkan…</p>
  </div>
  <div class="hr">
    <div class="dot busy" id="sdot"></div>
    <button class="bsm bg" onclick="exportPDF()" id="bpdf" style="display:none">↓ PDF</button>
  </div>
</header>
<div class="grand">
  <div class="gl">Total Semua Tabungan</div>
  <div class="ga" id="gtotal">Rp 0</div>
  <div class="gd" id="gdate"></div>
</div>
<div id="main"><div class="lwrap">Memuat data…</div></div>
<div id="toast"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────
const SB_URL = 'https://xboqivbagfuvadaawxdm.supabase.co';
const SB_KEY = 'sb_publishable_pkaL_zrBhSdMkolHyv6-1A_y5BK7-MP';
const HEADERS = {
  'Content-Type': 'application/json',
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY
};

// ── DATA ──────────────────────────────────────────────────────────────────
const GROUPS = [
  { id:'anak', label:'Tabungan Anak', members:[
    { id:'zaid',    name:'Zaid',    emoji:'👦', bg:'#EEF3FF', fg:'#3B6FE0', bc:'' },
    { id:'zubeir',  name:'Zubeir',  emoji:'👦', bg:'#FFF4EC', fg:'#D97040', bc:'' },
    { id:'zakaria', name:'Zakaria', emoji:'👦', bg:'#F0FDF4', fg:'#18A066', bc:'' },
  ]},
  { id:'project', label:'Tabungan Project', members:[
    { id:'magister', name:'Tabungan Magister', emoji:'🎓', bg:'#EDE9FE', fg:'#6D28D9', bc:'pu', sub:'Program S2' },
    { id:'umroh',    name:'Umroh Family',      emoji:'🕌', bg:'#CCFBF1', fg:'#0D7377', bc:'te', sub:'Dana Umroh Keluarga' },
  ]},
];
const ALL = GROUPS.flatMap(g => g.members);

const SEED = {
  zaid:[
    {type:'in', amount:1820000,note:'Saldo awal',         date:'2026-01-01'},
    {type:'out',amount:500000, note:'HP nenek',           date:'2026-01-01'},
    {type:'out',amount:20000,  note:'Lego curah',         date:'2026-01-01'},
    {type:'in', amount:790000, note:'THR',                date:'2026-04-01'},
    {type:'out',amount:20000,  note:'Pizza',              date:'2026-04-10'},
    {type:'out',amount:50000,  note:'Alat tulis',         date:'2026-04-10'},
    {type:'in', amount:50000,  note:'Dari nenek',         date:'2026-07-01'},
    {type:'in', amount:100000, note:'Dari ummi',          date:'2026-09-20'},
    {type:'in', amount:100000, note:'Dari ummi',          date:'2026-10-01'},
  ],
  zubeir:[
    {type:'in', amount:860000, note:'Saldo awal',         date:'2026-01-01'},
    {type:'out',amount:160000, note:'Lego curah',         date:'2026-01-01'},
    {type:'in', amount:790000, note:'THR',                date:'2026-04-01'},
    {type:'out',amount:20000,  note:'Pizza',              date:'2026-04-10'},
    {type:'out',amount:100000, note:'Alat tulis',         date:'2026-04-10'},
    {type:'in', amount:50000,  note:'Dari nenek',         date:'2026-07-01'},
    {type:'in', amount:100000, note:'Dari ummi',          date:'2026-09-20'},
    {type:'in', amount:100000, note:'Dari ummi',          date:'2026-10-01'},
  ],
  zakaria:[
    {type:'in', amount:570000, note:'THR 2026',           date:'2026-04-01'},
    {type:'out',amount:20000,  note:'Jajan & alat tulis', date:'2026-04-10'},
    {type:'in', amount:100000, note:'Dari ummi',          date:'2026-09-20'},
    {type:'in', amount:100000, note:'Dari ummi',          date:'2026-11-08'},
  ],
  magister:[], umroh:[],
};

// ── UTILS ─────────────────────────────────────────────────────────────────
const fmt = n => 'Rp ' + n.toLocaleString('id-ID');
const uid = () => crypto.randomUUID();
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => {
  if(!d) return '';
  const [y,m,day] = d.slice(0,10).split('-');
  const M=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return `${+day} ${M[+m-1]} ${y}`;
};
const daysUntil = d => d ? Math.ceil((new Date(d)-new Date(today()))/86400000) : null;

let state={}, nextUpdate={}, expanded={};

function toast(msg,dur=2200){
  const e=document.getElementById('toast');
  e.textContent=msg; e.classList.add('show');
  setTimeout(()=>e.classList.remove('show'),dur);
}
function syncStatus(s,lbl){
  const d=document.getElementById('sdot'), l=document.getElementById('slbl');
  d.className='dot '+s;
  l.textContent=lbl||{ok:'Tersinkron ✓',err:'Gagal sync',busy:'Menyimpan…'}[s];
}

// ── SUPABASE API ──────────────────────────────────────────────────────────
async function sbFetch(path, opts={}) {
  const r = await fetch(SB_URL + '/rest/v1/' + path, {
    headers: HEADERS, ...opts
  });
  if (!r.ok) {
    const err = await r.text();
    throw new Error(err);
  }
  return r.status === 204 ? null : r.json();
}

async function loadAll() {
  const rows = await sbFetch('tabungan?select=*&order=date.asc');
  ALL.forEach(m => { state[m.id] = { transactions: [] }; });
  rows.forEach(r => {
    if (state[r.member_id]) state[r.member_id].transactions.push(r);
  });
  // load schedules
  try {
    const sc = await sbFetch('schedule?select=*');
    sc.forEach(s => { nextUpdate[s.member_id] = s.next_date; });
  } catch(e) {}
}

async function insertTx(memberId, type, amount, note, date) {
  return sbFetch('tabungan', {
    method: 'POST',
    headers: { ...HEADERS, 'Prefer': 'return=representation' },
    body: JSON.stringify({ member_id: memberId, type, amount, note, date })
  });
}

async function deleteTxDb(id) {
  return sbFetch(`tabungan?id=eq.${id}`, { method: 'DELETE' });
}

async function upsertSchedule(memberId, nextDate) {
  return sbFetch('schedule', {
    method: 'POST',
    headers: { ...HEADERS, 'Prefer': 'resolution=merge-duplicates,return=representation' },
    body: JSON.stringify({ member_id: memberId, next_date: nextDate })
  });
}

// ── RENDER ────────────────────────────────────────────────────────────────
function bal(txs){ return (txs||[]).reduce((s,t)=>s+(t.type==='in'?t.amount:-t.amount),0); }
function grandTotal(){ return ALL.reduce((s,m)=>s+bal(state[m.id]?.transactions),0); }

function render() {
  document.getElementById('gtotal').textContent = fmt(grandTotal());
  document.getElementById('gdate').textContent =
    'Per '+new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  document.getElementById('bpdf').style.display = '';

  const main = document.getElementById('main');
  main.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'container';

  GROUPS.forEach(g => {
    const st = document.createElement('div');
    st.className = 'stitle'; st.textContent = g.label;
    wrap.appendChild(st);

    g.members.forEach(m => {
      const txs = state[m.id]?.transactions || [];
      const b = bal(txs);
      const nxt = nextUpdate[m.id];
      const days = daysUntil(nxt);
      const isOpen = !!expanded[m.id];

      let nb = '';
      if(nxt){
        if(days===0)   nb=`⏰ Update hari ini (${fmtDate(nxt)})`;
        else if(days<0) nb=`⚠️ Terlambat sejak ${fmtDate(nxt)}`;
        else            nb=`📅 ${fmtDate(nxt)} — ${days} hari lagi`;
      }
      const sub = m.sub || (txs.length===0 ? 'Belum ada transaksi' : `${txs.length} transaksi`);

      const cw = document.createElement('div'); cw.className='cw';
      cw.innerHTML = `
        <div class="cs" id="cs-${m.id}" onclick="toggle('${m.id}')"
          style="border-radius:${isOpen?'14px 14px 0 0':'14px'};${isOpen?'border-bottom:1px solid var(--border)':''}">
          <div class="av" style="background:${m.bg};color:${m.fg}">${m.emoji}</div>
          <div class="si"><div class="sn">${m.name}</div><div class="ss">${sub}</div></div>
          <div class="sb ${m.bc}">${fmt(b)}<span>saldo</span></div>
          <span class="cv${isOpen?' open':''}" id="cv-${m.id}">▼</span>
        </div>
        <div class="cd${isOpen?' open':''}" id="cd-${m.id}">
          ${nb?`<div class="nb">${nb}</div>`:''}
          <div class="history">
            ${txs.length===0
              ?'<div class="etx">Belum ada riwayat transaksi.</div>'
              :txs.map(t=>`
                <div class="tr">
                  <div class="ti ${t.type}">${t.type==='in'?'↑':'↓'}</div>
                  <div class="td">
                    <div class="tn">${t.note}</div>
                    <div class="tm">
                      <span>${t.type==='in'?'Masuk':'Keluar'}</span>
                      ${t.date?`<span class="tdb">${fmtDate(t.date)}</span>`:''}
                    </div>
                  </div>
                  <div class="ta ${t.type}">${t.type==='in'?'+':'−'}${fmt(t.amount)}</div>
                  <button class="tdel" onclick="event.stopPropagation();delTx('${m.id}','${t.id}')">×</button>
                </div>`).join('')}
          </div>
          <div class="atx">
            <div class="att">Tambah Transaksi</div>
            <div class="ir">
              <input type="text"   id="note-${m.id}" placeholder="Keterangan…" onclick="event.stopPropagation()"/>
              <input type="number" id="amt-${m.id}"  placeholder="Nominal" min="0" onclick="event.stopPropagation()"/>
            </div>
            <input type="date" id="date-${m.id}" value="${today()}" style="width:100%;margin-bottom:6px" onclick="event.stopPropagation()"/>
            <div class="br">
              <button class="btn bi" onclick="event.stopPropagation();addTx('${m.id}','in')">+ Pemasukan</button>
              <button class="btn bo" onclick="event.stopPropagation();addTx('${m.id}','out')">− Pengeluaran</button>
            </div>
            <div class="scr">
              <span class="scl">🗓 Update berikutnya:</span>
              <input type="date" id="sc-${m.id}" value="${nxt||''}" onclick="event.stopPropagation()"/>
              <button class="bsc" onclick="event.stopPropagation();saveSc('${m.id}')">Simpan</button>
            </div>
          </div>
        </div>`;
      wrap.appendChild(cw);
    });
  });

  const ft = document.createElement('div');
  ft.className='fn'; ft.textContent='Tabungan Keluarga • '+new Date().toLocaleString('id-ID');
  wrap.appendChild(ft);
  main.appendChild(wrap);
}

function toggle(id){
  expanded[id]=!expanded[id];
  const c=document.getElementById('cv-'+id);
  const d=document.getElementById('cd-'+id);
  const s=document.getElementById('cs-'+id);
  if(c) c.classList.toggle('open',expanded[id]);
  if(d) d.classList.toggle('open',expanded[id]);
  if(s){s.style.borderRadius=expanded[id]?'14px 14px 0 0':'14px';s.style.borderBottom=expanded[id]?'1px solid var(--border)':'';}
}

// ── ADD / DELETE / SCHEDULE ───────────────────────────────────────────────
async function addTx(id, type){
  const ne=document.getElementById('note-'+id);
  const ae=document.getElementById('amt-'+id);
  const de=document.getElementById('date-'+id);
  const note=ne.value.trim(), amount=parseInt(ae.value,10), date=de?.value||today();
  if(!note){ne.style.borderColor='var(--red)';return;}
  if(!amount||amount<=0){ae.style.borderColor='var(--red)';return;}
  ne.style.borderColor=ae.style.borderColor='';
  syncStatus('busy');
  try {
    const rows = await insertTx(id, type, amount, note, date);
    if(rows&&rows[0]) state[id].transactions.push(rows[0]);
    ne.value=ae.value=''; if(de) de.value=today();
    syncStatus('ok');
    toast(type==='in'?'+ Pemasukan dicatat ✓':'− Pengeluaran dicatat ✓');
    expanded[id]=true; render();
  } catch(e){ syncStatus('err'); toast('Gagal simpan: '+e.message); }
}

async function delTx(id, txId){
  if(!confirm('Hapus transaksi ini?')) return;
  syncStatus('busy');
  try {
    await deleteTxDb(txId);
    state[id].transactions = state[id].transactions.filter(t=>t.id!==txId);
    syncStatus('ok'); toast('Transaksi dihapus');
    expanded[id]=true; render();
  } catch(e){ syncStatus('err'); toast('Gagal hapus: '+e.message); }
}

async function saveSc(id){
  const v=document.getElementById('sc-'+id)?.value;
  if(!v) return;
  try {
    await upsertSchedule(id, v);
    nextUpdate[id]=v; toast('Jadwal disimpan ✓'); render();
  } catch(e){ toast('Gagal simpan jadwal'); }
}

// ── EXPORT PDF ────────────────────────────────────────────────────────────
function exportPDF(){
  const pd=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  let sec='';
  GROUPS.forEach(g=>{
    sec+=`<h2 style="font-size:11px;color:#7B859A;text-transform:uppercase;letter-spacing:.5px;margin:22px 0 9px;border-bottom:1px solid #E4E9F0;padding-bottom:5px">${g.label}</h2>`;
    g.members.forEach(m=>{
      const txs=state[m.id]?.transactions||[];
      const b=bal(txs);
      sec+=`<div style="margin-bottom:18px;page-break-inside:avoid">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span>${m.emoji}</span><span style="font-size:13px;font-weight:700;flex:1">${m.name}</span>
          <span style="font-size:13px;font-weight:700;color:#3B6FE0">${fmt(b)}</span>
        </div>
        <table style="width:100%;border-collapse:collapse">
          <thead><tr>
            ${['Tanggal','Keterangan','Jenis','Nominal'].map((h,i)=>
              `<th style="background:#F7F9FC;text-align:${i===3?'right':'left'};padding:5px 7px;font-size:10px;color:#7B859A;border-bottom:1px solid #E4E9F0">${h}</th>`
            ).join('')}
          </tr></thead>
          <tbody>
            ${txs.length===0?`<tr><td colspan="4" style="padding:7px;color:#7B859A;font-style:italic">Belum ada transaksi</td></tr>`:
              txs.map(t=>`<tr>
                <td style="padding:5px 7px;border-bottom:1px solid #F0F3F8;font-size:11px">${t.date?fmtDate(t.date):'—'}</td>
                <td style="padding:5px 7px;border-bottom:1px solid #F0F3F8;font-size:11px">${t.note}</td>
                <td style="padding:5px 7px;border-bottom:1px solid #F0F3F8;font-size:11px;color:${t.type==='in'?'#18A066':'#D94040'}">${t.type==='in'?'Masuk':'Keluar'}</td>
                <td style="padding:5px 7px;border-bottom:1px solid #F0F3F8;font-size:11px;text-align:right;color:${t.type==='in'?'#18A066':'#D94040'}">${t.type==='in'?'+':'−'}${fmt(t.amount)}</td>
              </tr>`).join('')}
            <tr style="background:#F7F9FC">
              <td colspan="3" style="padding:5px 7px;font-size:12px;border-top:2px solid #E4E9F0"><strong>Saldo ${m.name}</strong></td>
              <td style="padding:5px 7px;font-size:12px;text-align:right;border-top:2px solid #E4E9F0"><strong>${fmt(b)}</strong></td>
            </tr>
          </tbody>
        </table></div>`;
    });
  });
  const html=`<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><title>Laporan Tabungan</title></head>
<body style="font-family:'Segoe UI',Arial,sans-serif;color:#1A1F2E;margin:0;padding:28px;font-size:12px">
<h1 style="font-size:18px;font-weight:700;margin-bottom:2px">🏦 Laporan Tabungan Keluarga</h1>
<p style="color:#7B859A;font-size:11px;margin-bottom:14px">Dicetak: ${pd}</p>
<div style="background:#3B6FE0;color:#fff;border-radius:10px;padding:12px 16px;margin-bottom:4px">
  <div style="font-size:10px;opacity:.75;text-transform:uppercase;letter-spacing:.5px">Total Semua Tabungan</div>
  <div style="font-size:22px;font-weight:700;margin-top:2px">${fmt(grandTotal())}</div>
</div>${sec}
<p style="margin-top:22px;font-size:10px;color:#7B859A;border-top:1px solid #E4E9F0;padding-top:7px">Tabungan Keluarga App — ${pd}</p>
</body></html>`;
  const w=window.open('','_blank');
  w.document.write(html); w.document.close();
  setTimeout(()=>w.print(),400);
}

// ── INIT ──────────────────────────────────────────────────────────────────
async function init(){
  syncStatus('busy','Menghubungkan…');
  try {
    await loadAll();
    // Seed data jika kosong
    for(const m of ALL){
      if(state[m.id].transactions.length===0 && SEED[m.id]?.length>0){
        for(const t of SEED[m.id]){
          const rows = await insertTx(m.id, t.type, t.amount, t.note, t.date);
          if(rows&&rows[0]) state[m.id].transactions.push(rows[0]);
        }
      }
    }
    syncStatus('ok');
    render();
  } catch(e){
    syncStatus('err','Gagal konek — '+e.message);
    // fallback offline dengan seed data
    ALL.forEach(m=>{ state[m.id]={transactions:SEED[m.id]?.map((t,i)=>({...t,id:'seed-'+i,...{member_id:m.id}}))||[]}; });
    render();
    toast('Mode offline — data tidak tersimpan');
  }
}

init();
</script>
</body>
</html>
